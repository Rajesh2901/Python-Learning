<!-- Navigation Header -->
<header class="main-header">
    <div class="logo" routerLink="/home">
        <span class="logo-icon"><i class="fa-brands fa-python"></i></span>
        <span class="logo-text">Python<span class="highlight">Mastery</span></span>
    </div>
    <nav class="nav-links">
        <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
        <a routerLink="/topics" routerLinkActive="active" class="nav-link"><i class="fa-solid fa-book-open"></i> Topics</a>
        <a routerLink="/sandbox" routerLinkActive="active" class="nav-link"><i class="fa-solid fa-cubes"></i> 3D Sandbox</a>
        <a routerLink="/prep" routerLinkActive="active" class="nav-link"><i class="fa-solid fa-graduation-cap"></i> Interview Prep</a>
        <a routerLink="/about" routerLinkActive="active" class="nav-link"><i class="fa-solid fa-circle-info"></i> About</a>
    </nav>
    <div class="header-actions">
        <button id="theme-toggle" class="icon-btn" (click)="toggleTheme()" aria-label="Toggle Theme">
            <i class="fa-solid" [class.fa-sun]="isLightTheme" [class.fa-moon]="!isLightTheme"></i>
        </button>
        <a routerLink="/prep" class="btn btn-primary btn-sm">Interview Prep</a>
    </div>
</header>

<!-- Main Container -->
<main class="content-container">
    <router-outlet></router-outlet>
</main>

<!-- Footer -->
<footer class="main-footer">
    <p>&copy; 2026 Python Mastery. Designed for rapid developers. Built using Angular & FastAPI.</p>
</footer>
